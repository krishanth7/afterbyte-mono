name: Glyph request
description: Propose an original character or improve a planned glyph.
title: "[Glyph] "
body:
  - type: input
    id: character
    attributes:
      label: Character and Unicode code point
      placeholder: "Example: U+0041 LATIN CAPITAL LETTER A"
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Explain where the glyph is needed and which similar characters it must differ from.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Design proposal and provenance
      description: Include an original grid sketch if available. Identify the author and any external material.
