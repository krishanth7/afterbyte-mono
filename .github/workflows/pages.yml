name: Deploy font specimen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static specimen and version browser assets
        run: python3 tools/build_site.py --version "$GITHUB_SHA"
      - id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Publish specimen
        id: deployment
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The Pages upload did not return a valid artifact ID.');
            }
            const {owner, repo} = context.repo;
            const oidcToken = await core.getIDToken();
            const response = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifactId,
              pages_build_version: context.sha, oidc_token: oidcToken
            });
            const deployment = response.data;
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Pages did not return a deployment ID.');
            core.setOutput('page_url', deployment.page_url || 'https://krishanth7.github.io/afterbyte-mono/');
            core.info('Created Pages deployment ' + deploymentId + ' from artifact ' + artifactId);
            const failed = new Set(['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                owner, repo, deploymentId
              });
              const status = result.data.status;
              core.info('Pages status: ' + status);
              if (status === 'succeed') return;
              if (failed.has(status)) throw new Error('Pages deployment ended with ' + status);
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
              owner, repo, deploymentId
            });
            throw new Error('Pages deployment timed out after five minutes.');
