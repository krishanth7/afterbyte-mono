name: Font and specification checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-font.txt
      - name: Install pinned font tooling
        run: python -m pip install -r requirements-font.txt
      - name: Validate committed source and binaries
        run: |
          python tools/validate_vantablack_spec.py
          python tools/validate_vantablack_font.py
      - name: Rebuild original sources and binaries
        run: python tools/build_vantablack.py
      - name: Check reproducibility
        run: git diff --exit-code -- fonts/vantablack-gothic sources/vantablack-gothic docs/vantablack-gothic/system.json
