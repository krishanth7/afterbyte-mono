name: Font quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-font.txt
      - name: Install pinned font tooling
        run: python -m pip install -r requirements-font.txt
      - name: Validate Afterbyte Mono
        run: python tools/validate_afterbyte.py
      - name: Rebuild original vector sources and binaries
        run: |
          python tools/draw_afterbyte_vector.py
          python tools/build_afterbyte.py
      - name: Check reproducibility
        run: git diff --exit-code -- fonts/afterbyte-mono sources/afterbyte-mono
      - name: Validate preserved experiment
        run: |
          python tools/validate_vantablack_spec.py
          python tools/validate_vantablack_font.py
