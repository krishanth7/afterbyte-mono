name: Font quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-font.txt
      - name: Install pinned font tooling
        run: python -m pip install -r requirements-font.txt
      - name: Rebuild original core and both expanded releases
        run: |
          python tools/draw_afterbyte_vector.py
          python tools/build_afterbyte.py --version 5 --output build/v5/fonts
          python tools/build_afterbyte.py
      - name: Validate original core and all expanded glyphs
        run: |
          python tools/validate_afterbyte.py
          python tools/validate_expansion.py --version 4
          python tools/validate_expansion.py --version 5 --directory build/v5/fonts
      - name: Check reproducibility
        run: git diff --exit-code -- fonts/afterbyte-mono sources/afterbyte-mono
